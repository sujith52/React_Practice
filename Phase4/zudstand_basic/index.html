<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zustand Fixed CDN Demo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Import Maps: Externalize React so Zustand shares the exact same instance -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom": "https://esm.sh/react-dom@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "zustand": "https://esm.sh/zustand@4.5.2?external=react",
          "react-router-dom": "https://esm.sh/react-router-dom@6.23.1?external=react,react-dom"
        }
      }
    </script>
    
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body >
    <div id="root"></div>
    
    <script type="text/babel" data-type="module" src="./app.jsx"></script>
</body>
</html>
