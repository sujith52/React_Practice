<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media queries</title>
    <style>
        .box{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 16px;
            text-align: center;
            font-size: 2rem;
        }
        .card{
            padding: 15px;
            background-color: lightgray;
            border-radius: 12px;
        }
        @media(max-width:600px){
            .box{
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .card{
                padding: 8px 8px;
                font-size: 1rem;
            }
        }
        .navbar{
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px;
        }
        .links{
           display: flex;
            flex-direction: row;
            gap: 20px;
            text-align: center;
        }
        .links a{
            text-decoration: none;
            padding: 8px;
            background-color: lightgreen;
            border-radius: 8px;
        }
        @media (max-width:600px){
            .navbar{
                flex-direction: column;
            }
            .links{
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="card">Projects</div>
        <div class="card">Portfolio</div>
        <div class="card">Media</div>
        <div class="card">Experience</div>
    </div>
    <section>
        <nav class="navbar">
            <h2>Dev Zone</h2>
            <div class="links">
                <a href="/react-roadmap.md">React Roadmap</a>
                <a href="/djangoStart.md">Django Roadmap</a>
                <a href="/SQL_Roadmap_Dust_to_Galaxy.md">SQL</a>
            </div>
        </nav>
    </section>
</body>
</html>
