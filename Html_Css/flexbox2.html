<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        .main{
            display: flex;
            width: 900px;
            height: 200px;
            background-color: darkgray;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }
        .main > div{
            height: 25px;
            width: 25px;
            padding: 30px;
            background-color: blue;
        }
        .a1{
            /* flex-grow: 1; */
            flex-shrink: 1;
        }
        .a2{
            flex-grow: 2;
            background-color: aliceblue;
        }
        .a3{
            flex-grow: 1;
        }
        .dashboard{
            display: flex;
            gap: 20px;
            width: auto;
            height: 100px;
            background-color: lightseagreen;
            color: whitesmoke;
            font-size: 2rem;
        }
        .sidebar{
            flex: 0 0 220px;
            background-color: rgb(57, 56, 57);
            border-radius: 15px;
        }
        .content{
            flex: 1;
            min-width: 0;
        }
    </style>
</head>
<body>
    <section>
        <div class="main">
            <div class="a1">A</div>
            <div class="a2">B</div>
            <div class="a3">C</div>
        </div>
    </section>
    <section>
        <div class="dashboard">
            <aside class="sidebar">Sidebar</aside>
            <main class="content">Main content</main>
        </div>
    </section>
</body>
</html>
